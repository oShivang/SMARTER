# Model paths
model_path: "Qwen/Qwen2.5-7B-Instruct"
draft_model_path: "Qwen/Qwen2.5-1.5B-Instruct"

# Search settings
approach: "best_of_n"
smart_search: true
score_method: "conf"
n: 4
num_iterations: 10
max_tokens: 1024
temperature: 0.8

# Dataset settings
dataset_name: "HuggingFaceH4/MATH-500"
dataset_split: "test"
agg_strategy: "last"
conf_strategy: "probs_mean"
seed: 42
